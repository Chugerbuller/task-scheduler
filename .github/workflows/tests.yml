name: Go

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.24.x]
  
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'
        
    - name: Display Go version
      run: go version

    - name: Install dependencies
      run: go mod tidy

    - name: Run local server
      run: |
        go build -o scheduler ./cmd/main.go
        ./scheduler &
        for i in $(seq 1 30); do curl -sf http://localhost:7540/ >/dev/null && break; sleep 1; done
        go test ./tests
        
        
